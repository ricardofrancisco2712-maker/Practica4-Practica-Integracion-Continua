name: Alerta DevOps ITLA

on:
  push:
    branches:
      - main

jobs:
  hola-mundo:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Ejecutar Hola Mundo
        run: node index.js

      - name: Enviar notificación a ntfy
        run: |
          curl -H "Title: Hola Mundo -Ricardo Francisco Caamaño Santos 2021-0556" \
               -H "Priority: default" \
               -d "GitHub Actions ITLA." \
               https://ntfy.sh/devops-itla
